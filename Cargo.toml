[workspace]
members = ["crates/music-protocol", "crates/rustunes"]
default-members = ["crates/rustunes"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/fbiba/rustunes"
readme = "README.md"
rust-version = "1.89"

[workspace.dependencies]
aes = "=0.8.4"
anyhow = "1"
cbc = "=0.1.2"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["miniz_oxide"] }
hmac = "=0.12.1"
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "bmp", "tiff"] }
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "ring", "syslog_relay", "afc", "heartbeat", "mdns"] }
lofty = { version = "=0.22.4", default-features = false }
libc = "=0.2.190"
mdns-sd = { version = "=0.21.5", default-features = false }
plist = "1.8"
png = { version = "=0.18.1", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
symphonia-bundle-mp3 = { version = "=0.5.4", default-features = false, features = ["mp3"] }
symphonia-core = { version = "=0.5.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "net"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
