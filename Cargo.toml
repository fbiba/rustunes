[workspace]
members = ["crates/music-protocol"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/fbiba/rustunes"
readme = "README.md"
rust-version = "1.89"

[workspace.dependencies]
aes = "=0.8.4"
anyhow = "1"
cbc = "=0.1.2"
clap = { version = "4", features = ["derive"] }
hmac = "=0.12.1"
idevice = { version = "=0.1.68", default-features = false, features = ["usbmuxd", "ring", "syslog_relay", "afc", "heartbeat", "mdns"] }
plist = "1.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "net"] }
