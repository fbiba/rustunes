[package]
name = "music-protocol"
version = "0.1.0"
edition = "2024"
description = "Reusable ATC protocol, media and catalogue mechanisms for the native iPhone Music library"
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[features]
default = []
# Offline test fixtures (in-memory AFC, synthetic catalogues, MPEG frames) for the
# tests of this crate and of crates built on it; excluded from production builds.
offline-test-support = []

[dependencies]
aes.workspace = true
anyhow.workspace = true
cbc.workspace = true
hmac.workspace = true
sha1.workspace = true
idevice.workspace = true
plist.workspace = true
tokio.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
image.workspace = true
jpeg-encoder.workspace = true
png.workspace = true

[dev-dependencies]
clap.workspace = true
tokio = { workspace = true, features = ["test-util"] }
