[package]
name = "rustunes"
version = "0.1.0"
edition = "2024"
description = "Sync local music (ALAC, AAC, MP3, FLAC, WAV, AIFF) into the stock iPhone Music library from Linux, over USB or Wi-Fi"
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[dependencies]
music-protocol = { path = "../music-protocol" }
anyhow.workspace = true
idevice.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
# Offline test fixtures only; the production dependency leaves them off.
music-protocol = { path = "../music-protocol", features = ["offline-test-support"] }
tokio = { workspace = true, features = ["test-util"] }
